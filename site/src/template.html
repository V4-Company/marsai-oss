<!doctype html>
<html lang="{{htmlLang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="en" href="{{altEn}}">
<link rel="alternate" hreflang="pt-BR" href="{{altPt}}">
<link rel="alternate" hreflang="x-default" href="{{altEn}}">
<link rel="alternate" type="text/markdown" title="Install instructions for coding agents" href="{{siteUrl}}/install.md">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MarsAI · V4 Company">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="{{ogLocale}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{ogImage}}">
<link rel="icon" href="{{favicon}}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{css}}">
</head>
<body>
<header class="topbar" id="topbar"></header>

<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main id="main"><noscript>{{noscript}}</noscript></main>
</div>
<div class="scrim" id="scrim"></div>

<div class="searchwrap" id="searchwrap" hidden>
  <div class="searchbox" role="dialog">
    <div class="searchinput">
      <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
      <input id="searchinput" type="text" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="searchresults" id="searchresults"></div>
  </div>
</div>

<script src="{{marked}}"></script>
<script src="{{data}}"></script>
<script src="{{js}}"></script>
</body>
</html>
