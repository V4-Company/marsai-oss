<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram title</title>
<style>
:root{--paper:#09090b;--paper-2:#17171b;--ink:#ededf0;--muted:#a3a3ad;--rule:#70707a;--accent:#f5b73d;--link:#82acff}
*{box-sizing:border-box}body{margin:0;padding:32px;background:var(--paper);color:var(--ink);font:14px/1.6 system-ui,sans-serif}
.frame{--diagram-width:1280px;width:100%;max-width:var(--diagram-width);margin:auto}
h1{font-size:32px;font-weight:500}.eyebrow{font:11px ui-monospace,monospace;color:var(--accent);letter-spacing:.12em}
p,footer{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.diagram-container{overflow-x:auto}
svg{display:block;width:var(--diagram-width);min-width:var(--diagram-width);height:auto}
.node-name{font:600 15px system-ui,sans-serif;fill:var(--ink)}.sublabel{font:11px ui-monospace,monospace;fill:var(--muted)}
.arrow-label{font:10px ui-monospace,monospace;fill:var(--muted)}footer{border-top:1px solid var(--rule);padding-top:16px}
@media(max-width:600px){body{padding:16px}h1{font-size:26px}}@media print{.diagram-container{overflow:visible}}
</style>
</head>
<body><main class="frame">
<div class="eyebrow">V4 COMPANY / MARSAI</div><h1>Diagram title</h1><p>What this drawing explains.</p>
<div class="diagram-container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Diagram title</title><desc id="diagram-desc">Describe the relationships for a reader who cannot see the drawing.</desc>
<!-- Draw the sourced content using the selected type reference. -->
</svg></div>
<footer>Sources and revisions: fill from the read sources. Uncertainties: list or state none. Cuts: list omitted details.</footer>
</main></body></html>
