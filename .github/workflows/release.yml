name: release

# A merged pull request that bumps the version is the release: when main carries
# a version with no tag yet, this creates the tags and the GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Version agrees everywhere
        run: node scripts/version.mjs check

      - name: Tag and publish when the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "v${version} already released"
            exit 0
          fi
          node scripts/version.mjs notes > notes.md
          for tag in "v${version}" "marsai-core--v${version}" "marsai-dev--v${version}" "marsai-extras--v${version}"; do
            git tag "$tag"
          done
          git push origin "v${version}" "marsai-core--v${version}" "marsai-dev--v${version}" "marsai-extras--v${version}"
          gh release create "v${version}" --title "MarsAI ${version}" --notes-file notes.md
