name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plugins (frontmatter, names, links)
        run: |
          pip install --quiet pyyaml
          python3 scripts/check_plugins.py

      - name: Guard hooks
        run: |
          for test in plugins/*/hooks/*.test.py; do
            echo "== $test"
            python3 "$test"
          done

      - name: Diagram geometry regressions
        run: python3 tests/diagram-design/geometry.test.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: One version everywhere, with a changelog entry
        run: node scripts/version.mjs check

      - name: Diagram rendered-text checks
        run: node --test tests/diagram-design/browser-check.test.mjs

      - name: Installer
        run: |
          npm ci
          npm test

      - name: Site builds, in both languages
        run: |
          npm ci --prefix site
          npm test --prefix site
          node site/build.mjs
